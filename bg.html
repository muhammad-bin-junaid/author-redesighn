<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background - Notebook Lines</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #f0eaff 0%, #f5f0ff 50%, #ece7ff 100%) fixed;
            min-height: 100vh;
        }
        main {
            background: repeating-linear-gradient(#0000 0 31px, #cce5ff 31px 32px);
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <main></main>
</body>
</html>
